<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>E-EXAM — Portal Ujian Online</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    :root {
      --primary: #1a56db;
      --primary-dark: #1245b0;
      --accent: #f59e0b;
      --bg: #f0f4ff;
    }
    body { background: var(--bg); font-family: 'Segoe UI', sans-serif; }

    /* NAVBAR */
    .navbar { background: var(--primary); }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; color: #fff !important; }
    .navbar-brand span { color: var(--accent); }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff; padding: 3.5rem 0 3rem;
      clip-path: ellipse(120% 100% at 50% 0%);
    }
    .hero h1 { font-size: 2rem; font-weight: 800; }
    .hero p { opacity: .85; }

    /* MAPEL CARD */
    .card-mapel {
      border: none; border-radius: 14px;
      box-shadow: 0 2px 12px rgba(26,86,219,.10);
      transition: transform .2s, box-shadow .2s;
    }
    .card-mapel:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(26,86,219,.18); }
    .mapel-icon {
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; margin-bottom: .75rem;
    }
    .badge-kelas { font-size: .7rem; cursor: pointer; }

    /* DROPDOWN KELAS inside card */
    .kelas-select { display: none; }
    .kelas-select.show { display: block; }

    /* SIDEBAR BTN */
    .sidebar-float {
      position: fixed; bottom: 1.5rem; right: 1rem;
      display: flex; flex-direction: column; gap: .5rem; z-index: 99;
    }
    .sidebar-float .btn { border-radius: 50px; font-size: .82rem; box-shadow: 0 2px 8px rgba(0,0,0,.18); }

    /* FOOTER */
    footer { background: var(--primary); color: rgba(255,255,255,.7); font-size: .82rem; padding: 1rem 0; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg px-3 py-2">
  <span class="navbar-brand"><i class="bi bi-mortarboard-fill me-2"></i>E<span>-EXAM</span></span>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span class="badge bg-light text-primary">Portal Ujian Online</span>
  </div>
</nav>

<!-- HERO -->
<div class="hero text-center mb-4">
  <div class="container">
    <h1><i class="bi bi-journal-check me-2"></i>Ujian Online Sekolah</h1>
    <p class="mb-0">Pilih mata pelajaran dan kelas untuk memulai ujian.</p>
  </div>
</div>

<!-- MAPEL LIST -->
<div class="container pb-5">
  <div class="d-flex align-items-center mb-3">
    <h5 class="fw-bold mb-0 me-auto"><i class="bi bi-grid-fill text-primary me-2"></i>Mata Pelajaran Tersedia</h5>
    <small class="text-muted" id="info-count"></small>
  </div>

  <div class="row g-3" id="mapel-container">
    <!-- Skeleton loader -->
    <div class="col-6 col-md-4 col-lg-3 skeleton-item" id="sk1">
      <div class="card card-mapel p-3">
        <div class="placeholder-glow"><span class="placeholder col-12 rounded" style="height:60px"></span></div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-lg-3 skeleton-item" id="sk2">
      <div class="card card-mapel p-3">
        <div class="placeholder-glow"><span class="placeholder col-12 rounded" style="height:60px"></span></div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-lg-3 skeleton-item" id="sk3">
      <div class="card card-mapel p-3">
        <div class="placeholder-glow"><span class="placeholder col-12 rounded" style="height:60px"></span></div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-lg-3 skeleton-item" id="sk4">
      <div class="card card-mapel p-3">
        <div class="placeholder-glow"><span class="placeholder col-12 rounded" style="height:60px"></span></div>
      </div>
    </div>
  </div>

  <div id="empty-state" class="text-center py-5 d-none">
    <i class="bi bi-inbox display-4 text-muted"></i>
    <p class="mt-2 text-muted">Belum ada mata pelajaran. Admin belum menambahkan ujian.</p>
  </div>
</div>

<!-- FLOATING SIDEBAR BUTTONS -->
<div class="sidebar-float">
  <button class="btn btn-warning btn-sm" onclick="location.href='guru.html'">
    <i class="bi bi-person-badge me-1"></i>Guru
  </button>
  <button class="btn btn-dark btn-sm" onclick="location.href='admin.html'">
    <i class="bi bi-shield-lock me-1"></i>Admin
  </button>
</div>

<!-- FOOTER -->
<footer class="text-center mt-4">
  <p class="mb-0">© 2025 E-EXAM — Portal Ujian Online</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const ICONS = {
  default: "📚", matematika: "🔢", ipa: "🔬", ips: "🌍",
  bahasa_indonesia: "🇮🇩", bahasa_inggris: "🗣️", fisika: "⚛️",
  kimia: "⚗️", biologi: "🧬", sejarah: "📜", pkn: "🏛️",
  agama: "🕌", seni: "🎨", olahraga: "⚽",
};

async function loadMapel() {
  try {
    const res = await fetch("/api/mapel");
    const data = await res.json();
    renderMapel(data);
  } catch {
    renderMapel([]);
  }
}

function renderMapel(list) {
  document.querySelectorAll(".skeleton-item").forEach(el => el.remove());
  const container = document.getElementById("mapel-container");
  const empty     = document.getElementById("empty-state");

  if (!list.length) { empty.classList.remove("d-none"); return; }

  document.getElementById("info-count").textContent = `${list.length} mapel`;

  list.forEach(m => {
    const icon = ICONS[m.id] || ICONS.default;
    const kelasBadges = (m.kelas || [10,11,12]).map(k =>
      `<span class="badge bg-primary badge-kelas me-1" onclick="pilihKelas(this,'${m.id}','${m.nama}',${k})">Kelas ${k}</span>`
    ).join("");

    const col = document.createElement("div");
    col.className = "col-6 col-md-4 col-lg-3";
    col.innerHTML = `
      <div class="card card-mapel p-3 h-100">
        <div class="mapel-icon">${icon}</div>
        <h6 class="fw-bold mb-1">${m.nama}</h6>
        <p class="text-muted mb-2" style="font-size:.75rem">Pilih kelas:</p>
        <div>${kelasBadges}</div>
      </div>`;
    container.appendChild(col);
  });
}

function pilihKelas(el, mapelId, mapelNama, kelas) {
  // Save to sessionStorage and redirect to form
  sessionStorage.setItem("exam_mapel_id", mapelId);
  sessionStorage.setItem("exam_mapel_nama", mapelNama);
  sessionStorage.setItem("exam_kelas", kelas);
  location.href = "form-ujian.html";
}

loadMapel();
</script>
</body>
</html>
