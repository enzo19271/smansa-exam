<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – E-EXAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <div class="logo-icon">
        <i class="bi bi-mortarboard-fill text-white fs-4"></i>
      </div>
      <h4 class="text-white fw-800 mb-0">E-EXAM</h4>
      <p class="text-white-50 small mb-0">Sistem Ujian Online</p>
    </div>

    <!-- Body -->
    <div class="login-body">
      <p class="text-muted small text-center mb-3">Masuk dengan akun yang telah diberikan</p>

      <!-- Alert error -->
      <div id="alertError" class="alert alert-danger alert-login d-none" role="alert">
        <i class="bi bi-exclamation-circle me-1"></i>
        <span id="alertMsg">Login gagal</span>
      </div>

      <!-- Form -->
      <div class="mb-3">
        <label class="form-label fw-600 small">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input
            type="text"
            id="inputUsername"
            class="form-control border-start-0 ps-0"
            placeholder="Masukkan username"
            autocomplete="username"
          />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-600 small">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input
            type="password"
            id="inputPassword"
            class="form-control border-start-0 ps-0"
            placeholder="Masukkan password"
            autocomplete="current-password"
          />
          <button class="input-group-text bg-white border-start-0 btn-toggle-pw" id="btnTogglePw" type="button">
            <i class="bi bi-eye text-muted" id="iconEye"></i>
          </button>
        </div>
      </div>

      <button id="btnLogin" class="btn btn-login w-100 py-2">
        <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Masuk</span>
        <span id="btnSpinner" class="d-none">
          <span class="spinner-border spinner-border-sm me-1" role="status"></span> Memverifikasi...
        </span>
      </button>

      <!-- Role hints -->
      <div class="role-hint mt-4">
        <span class="bg-primary bg-opacity-10 text-primary">
          <i class="bi bi-person-badge me-1"></i>Siswa
        </span>
        <span class="bg-success bg-opacity-10 text-success">
          <i class="bi bi-person-workspace me-1"></i>Guru
        </span>
        <span class="bg-danger bg-opacity-10 text-danger">
          <i class="bi bi-shield-lock me-1"></i>Admin
        </span>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  // Jika sudah login, redirect
  const existingSession = Auth.getSession();
  if (existingSession) Auth.redirectByRole(existingSession.role);

  // Toggle password visibility
  document.getElementById("btnTogglePw").addEventListener("click", () => {
    const input = document.getElementById("inputPassword");
    const icon  = document.getElementById("iconEye");
    if (input.type === "password") {
      input.type = "text";
      icon.className = "bi bi-eye-slash text-muted";
    } else {
      input.type = "password";
      icon.className = "bi bi-eye text-muted";
    }
  });

  // Enter key
  document.getElementById("inputPassword").addEventListener("keydown", (e) => {
    if (e.key === "Enter") doLogin();
  });
  document.getElementById("inputUsername").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("inputPassword").focus();
  });

  // Login
  document.getElementById("btnLogin").addEventListener("click", doLogin);

  async function doLogin() {
    const username = document.getElementById("inputUsername").value.trim();
    const password = document.getElementById("inputPassword").value;

    // Sembunyikan error
    const alertEl = document.getElementById("alertError");
    alertEl.classList.add("d-none");

    if (!username || !password) {
      showError("Username dan password wajib diisi");
      return;
    }

    // Loading state
    setLoading(true);

    try {
      const user = await Auth.login(username, password);
      Auth.redirectByRole(user.role);
    } catch (err) {
      showError(err.message);
      setLoading(false);
    }
  }

  function showError(msg) {
    const alertEl = document.getElementById("alertError");
    document.getElementById("alertMsg").textContent = msg;
    alertEl.classList.remove("d-none");
  }

  function setLoading(state) {
    document.getElementById("btnLogin").disabled = state;
    document.getElementById("btnText").classList.toggle("d-none", state);
    document.getElementById("btnSpinner").classList.toggle("d-none", !state);
  }
</script>
</body>
</html>
