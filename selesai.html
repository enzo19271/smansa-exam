<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Hasil Ujian — Smansanam Exam Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ── ROOT VARIABLES (MODERN CLEAN STYLE) ── */
        :root {
            --primary-blue: #2563eb;
            --blue-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            
            /* Lightweight & Clean Shadows */
            --light-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --float-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            --card-radius: 24px;
        }

        [data-bs-theme="dark"] {
            --primary-blue: #3b82f6;
            --blue-gradient: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            --bg-body: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            
            --light-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            --float-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* ── GLOBAL ── */
        body {
            background: var(--bg-body);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── TOPBAR (FLAT & MINIMALIST) ── */
        .topbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .topbar .brand {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-dark);
            letter-spacing: -0.4px;
        }
        .topbar .brand span {
            color: var(--primary-blue);
            font-weight: 800;
        }
        .topbar .brand i {
            color: var(--primary-blue);
            margin-right: 8px;
            font-size: 1.15rem;
        }

        .theme-toggle {
            background: var(--bg-body);
            border: 1px solid var(--card-border);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05rem;
        }
        .theme-toggle:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            transform: scale(1.02);
        }

        /* ── SOLID HERO RESULT ── */
        .result-hero {
            background: var(--blue-gradient);
            padding: 3.5rem 1rem 6rem;
            text-align: center;
            color: #ffffff;
            position: relative;
            border-radius: 0 0 36px 36px;
            transition: background 0.3s ease;
        }

        .student-info {
            font-size: 0.95rem;
            opacity: 0.95;
            margin-bottom: 1.8rem;
            font-weight: 600;
            animation: fadeInDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .student-info .badge-guru {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 0.4rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* ── SCORE CIRCLE ── */
        .score-circle-wrap {
            margin: 0 auto 0.5rem;
            width: 160px;
            height: 160px;
            position: relative;
            animation: zoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .score-circle-wrap svg {
            transform: rotate(-90deg);
        }
        .score-number {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .score-number .val {
            font-size: 3.4rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
        }
        .score-number .lbl {
            font-size: 0.65rem;
            opacity: 0.8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 4px;
        }

        .predikat-text {
            font-size: 1.35rem;
            font-weight: 800;
            margin-top: 1.2rem;
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            animation-delay: 0.15s;
        }

        /* ── COMPACT SOLID FLOATING CARD ── */
        .result-card-float {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--card-radius);
            box-shadow: var(--float-shadow);
            padding: 2.25rem 2rem;
            margin: -4rem auto 0;
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: slideUpFloat 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.25s;
            max-width: 460px;
            color: var(--text-dark);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .message-box {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .message-box .emoji-big {
            font-size: 2.75rem;
            line-height: 1;
            display: block;
            margin-bottom: 0.75rem;
            animation: zoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s both;
        }
        .message-box h4 {
            font-weight: 800;
            color: var(--text-dark);
            font-size: 1.35rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.3px;
        }
        .message-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0;
            font-weight: 500;
        }

        .section-divider {
            height: 1px;
            background: var(--card-border);
            margin: 1.5rem 0;
        }

        /* ── BUTTON SNAP ── */
        .btn-home {
            background: var(--blue-gradient);
            border: none;
            color: #ffffff;
            font-weight: 700;
            border-radius: 14px;
            padding: 0.9rem 1.5rem;
            width: 100%;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-home:hover:not(:disabled) {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }
        .btn-home:active {
            transform: translateY(0);
        }
        .btn-home:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ── FAST SUBTLE ANIMATIONS ── */
        @keyframes slideUpFloat {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── CONFETTI CHIPS ── */
        .confetti-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
        }
        .confetti-bar span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: confettiFall 1.2s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(15px) scale(1.2); opacity: 0; }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 576px) {
            .result-hero {
                padding: 2.5rem 1rem 5.5rem;
                border-radius: 0 0 28px 28px;
            }
            .result-card-float {
                padding: 1.75rem 1.5rem;
                margin: -3.5rem 1rem 0;
            }
            .score-circle-wrap {
                width: 140px;
                height: 140px;
            }
            .score-number .val {
                font-size: 2.8rem;
            }
            .message-box h4 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <span class="brand">
            <i class="fa-solid fa-graduation-cap"></i><span>Smansanam</span> Exam Portal
        </span>
        <button class="theme-toggle" id="themeSwitcher" title="Ganti Tema">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <div class="result-hero" id="result-hero">
        <div class="confetti-bar" id="confetti-bar"></div>
        <div class="student-info" id="sub-info">—</div>

        <div class="score-circle-wrap">
            <svg width="100%" height="100%" viewBox="0 0 160 160">
                <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12" />
                <circle cx="80" cy="80" r="70" fill="none"
                stroke="#ffffff" stroke-width="12"
                stroke-linecap="round"
                id="score-arc"
                stroke-dasharray="439.8"
                stroke-dashoffset="439.8"
                style="transition: stroke-dashoffset 1.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s" />
            </svg>
            <div class="score-number">
                <span class="val" id="nilai-text">0</span>
                <span class="lbl">Nilai Akhir</span>
            </div>
        </div>

        <div class="predikat-text" id="predikat-text">—</div>
    </div>

    <div class="result-card-float">
        <div class="message-box">
            <span class="emoji-big">✨</span>
            <h4 id="greeting-name">Kerja Bagus!</h4>
            <p>Ujian telah berhasil diselesaikan. Jadikan hasil ini sebagai motivasi untuk terus belajar dan meraih prestasi yang lebih tinggi.</p>
        </div>

        <div class="section-divider"></div>

        <button class="btn-home" onclick="clearSession()">
            <i class="fa-solid fa-house"></i> Kembali ke Beranda
        </button>
    </div>

    <div style="height:3rem"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ── THEME SWITCHER ─────────────────────────────────────────────────────────
        const themeSwitcher = document.getElementById('themeSwitcher');
        const htmlTag = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');

        if (themeSwitcher) {
            themeSwitcher.addEventListener('click', () => {
                const currentTheme = htmlTag.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                htmlTag.setAttribute('data-bs-theme', newTheme);
                themeIcon.className = newTheme === 'light' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
                localStorage.setItem('theme', newTheme);
            });
            const savedTheme = localStorage.getItem('theme') || 'light';
            htmlTag.setAttribute('data-bs-theme', savedTheme);
            themeIcon.className = savedTheme === 'light' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        // ── AMBIL DATA DARI SESSION ──────────────────────────────────────────────
        const raw = sessionStorage.getItem("hasil_ujian");
        const nama = sessionStorage.getItem("siswa_nama") || "Siswa";
        const kel = sessionStorage.getItem("siswa_kelas") || "—";
        const mapN = sessionStorage.getItem("exam_mapel_nama") || "Mata Pelajaran";
        const guruN = sessionStorage.getItem("exam_guru_nama") || "Guru";

        let hasil = {};
        if (raw) {
            try { hasil = JSON.parse(raw); } catch { hasil = {}; }
        }

        const nilai = hasil.nilai ?? hasil.score ?? null;

        // Sapaan personal
        document.getElementById("greeting-name").textContent = `Kerja Bagus, ${nama.split(' ')[0]}!`;

        if (nilai === null) {
            document.getElementById("nilai-text").textContent = "—";
            document.getElementById("sub-info").innerHTML =
                `<i class="fa-regular fa-circle-question me-1"></i> Data hasil tidak ditemukan`;
            document.getElementById("predikat-text").textContent = "Hubungi guru kamu";
        } else {
            // ── TAMPILKAN DATA & ANIMASI ──────────────────────────────────────────
            document.getElementById("sub-info").innerHTML = `
                <i class="fa-regular fa-user me-1"></i> ${nama} &nbsp;&bull;&nbsp; Kelas ${kel}
                <br>
                <span class="badge-guru mt-2">
                    <i class="fa-regular fa-book-open me-1"></i> ${mapN}
                    <span class="mx-1 opacity-25">|</span>
                    <i class="fa-regular fa-user me-1"></i> ${guruN}
                </span>
            `;

            const n = parseFloat(nilai) || 0;

            // Animasi angka (Counting Up)
            const duration = 1500;
            const start = performance.now();
            const nilaiEl = document.getElementById("nilai-text");

            function animateScore(time) {
                let progress = (time - start) / duration;
                if (progress > 1) progress = 1;
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const currentScore = (easeProgress * n).toFixed(n % 1 === 0 ? 0 : 1);
                nilaiEl.textContent = currentScore;
                if (progress < 1) {
                    requestAnimationFrame(animateScore);
                } else {
                    nilaiEl.textContent = n;
                }
            }
            requestAnimationFrame(animateScore);

            // Animasi Lingkaran (SVG Stroke Dashoffset)
            const arc = document.getElementById("score-arc");
            const circumference = 439.8;
            setTimeout(() => {
                arc.style.strokeDashoffset = circumference - (circumference * (n / 100));
            }, 100);

            // ── PREDIKAT & CONFETTI ──────────────────────────────────────────────
            let predikat, emoji, confettiColors;
            if (n >= 90) { 
                predikat = "Luar Biasa!";
                emoji = "🏆";
                confettiColors = ["#fbbf24", "#f59e0b", "#fcd34d", "#ffffff", "#fbbf24"]; 
            } else if (n >= 80) { 
                predikat = "Sangat Baik";
                emoji = "⭐";
                confettiColors = ["#60a5fa", "#3b82f6", "#93c5fd", "#ffffff", "#60a5fa"]; 
            } else if (n >= 70) { 
                predikat = "Baik";
                emoji = "👍";
                confettiColors = ["#34d399", "#10b981", "#6ee7b7", "#ffffff", "#34d399"]; 
            } else if (n >= 60) { 
                predikat = "Cukup";
                emoji = "📚";
                confettiColors = ["#fbbf24", "#d97706", "#fde68a", "#ffffff", "#fbbf24"]; 
            } else { 
                predikat = "Tetap Semangat!";
                emoji = "💪";
                confettiColors = ["#f87171", "#ef4444", "#fca5a5", "#ffffff", "#f87171"]; 
            }

            document.getElementById("predikat-text").innerHTML = `${emoji} ${predikat}`;

            // Generate Confetti
            const bar = document.getElementById("confetti-bar");
            confettiColors.forEach((c, i) => {
                const s = document.createElement("span");
                s.style.background = c;
                s.style.animationDelay = `${i * 150}ms`;
                if (i % 2 === 0) { 
                    s.style.width = "14px";
                    s.style.height = "14px"; 
                }
                bar.appendChild(s);
            });
        }

        // ── CLEAR SESSION & KEMBALI KE HOME ──────────────────────────────────────
        function clearSession() {
            const btn = document.querySelector('.btn-home');
            btn.innerHTML =
                '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Mengalihkan...';
            btn.disabled = true;

            setTimeout(() => {
                ["exam_mapel_id", "exam_mapel_nama", "exam_kelas", "siswa_nama", "siswa_kelas",
                    "siswa_kelas_main", "exam_guru_nama", "hasil_ujian"
                ].forEach(k => sessionStorage.removeItem(k));
                location.href = "index.html";
            }, 600);
        }
    </script>
</body>
</html>
