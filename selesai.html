<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hasil Ujian — Smansanam Exam Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

  <style>
    :root {
      --bg-body: #f8fafc;
      --blue-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --blue-accent: #3b82f6;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    body {
      background: var(--bg-body);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
    }

    /* TOPBAR */
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.25rem;
      display: flex; align-items: center;
    }
    .topbar .brand { font-weight: 500; font-size: 1rem; }
    .topbar .brand span {
      font-style: italic; font-weight: 800;
      background: var(--blue-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* HERO RESULT */
    .result-hero {
      background: var(--blue-gradient);
      padding: 2.5rem 1rem 4.5rem;
      text-align: center;
      color: #fff;
      position: relative;
    }
    .result-hero .student-info {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    /* SCORE CIRCLE */
    .score-circle-wrap {
      margin: 0 auto 0.5rem;
      width: 150px; height: 150px;
      position: relative;
    }
    .score-circle-wrap svg {
      transform: rotate(-90deg);
    }
    .score-number {
      position: absolute;
      inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .score-number .val { font-size: 2.6rem; font-weight: 800; line-height: 1; }
    .score-number .lbl { font-size: 0.7rem; opacity: 0.75; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .predikat-text { font-size: 1.1rem; font-weight: 700; margin-top: 0.75rem; }

    /* FLOATING CARD */
    .result-card-float {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 1.5rem;
      margin: -2.5rem 1rem 0;
      position: relative;
      z-index: 10;
    }
    .stat-item {
      text-align: center;
      padding: 0.75rem 0.5rem;
      border-radius: 14px;
    }
    .stat-item .val { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .stat-item .lbl { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* DIVIDER */
    .section-divider {
      height: 1px; background: var(--border-color);
      margin: 1.25rem 0;
    }

    /* REVIEW */
    .review-wrap { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
    .review-wrap.open { max-height: 9999px; }
    .review-item {
      display: flex; gap: 0.75rem; align-items: flex-start;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    .review-item.correct { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .review-item.wrong   { background: #fff1f2; border: 1px solid #fecdd3; }
    .review-num {
      width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.78rem;
    }
    .correct .review-num { background: #22c55e; color: #fff; }
    .wrong   .review-num { background: #ef4444; color: #fff; }
    .review-detail { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }

    /* ACTIONS */
    .btn-home {
      background: var(--blue-gradient);
      border: none; color: #fff;
      font-weight: 700; border-radius: 14px;
      padding: 0.75rem;
      width: 100%;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
      transition: all 0.2s;
    }
    .btn-home:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(37,99,235,0.35); }
    .btn-review-toggle {
      background: #f1f5f9;
      border: 1.5px solid var(--border-color);
      color: var(--text-dark);
      font-weight: 700; border-radius: 14px;
      padding: 0.75rem;
      width: 100%;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-review-toggle:hover { background: #e2e8f0; }

    /* confetti dots (pure CSS) */
    .confetti-bar {
      display: flex; justify-content: center; gap: 4px;
      margin-bottom: 0.5rem;
    }
    .confetti-bar span {
      width: 8px; height: 8px; border-radius: 50%;
      animation: confettiFall 1.2s ease both;
    }
    @keyframes confettiFall {
      from { transform: translateY(-20px) scale(0); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    @media (max-width: 480px) {
      .result-hero { padding: 2rem 1rem 4rem; }
      .result-card-float { margin: -2rem 0.75rem 0; padding: 1.25rem; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <span class="brand"><span>Smansanam</span> Exam Portal</span>
</div>

<!-- HERO -->
<div class="result-hero" id="result-hero">
  <div class="confetti-bar" id="confetti-bar"></div>
  <p class="student-info" id="sub-info">—</p>

  <div class="score-circle-wrap">
    <svg width="150" height="150" viewBox="0 0 150 150">
      <!-- track -->
      <circle cx="75" cy="75" r="62" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="10"/>
      <!-- fill -->
      <circle cx="75" cy="75" r="62" fill="none"
        stroke="white" stroke-width="10"
        stroke-linecap="round"
        id="score-arc"
        stroke-dasharray="389.56"
        stroke-dashoffset="389.56"
        style="transition: stroke-dashoffset 1.2s cubic-bezier(0.34,1.56,0.64,1)"/>
    </svg>
    <div class="score-number">
      <span class="val" id="nilai-text">—</span>
      <span class="lbl">Nilai</span>
    </div>
  </div>

  <div class="predikat-text" id="predikat-text">—</div>
</div>

<!-- FLOATING CARD -->
<div class="result-card-float mx-auto" style="max-width:500px">

  <!-- Stats row -->
  <div class="row g-0">
    <div class="col-4">
      <div class="stat-item">
        <div class="val text-success" id="benar-text">—</div>
        <div class="lbl">✓ Benar</div>
      </div>
    </div>
    <div class="col-4">
      <div class="stat-item">
        <div class="val text-danger" id="salah-text">—</div>
        <div class="lbl">✗ Salah</div>
      </div>
    </div>
    <div class="col-4">
      <div class="stat-item">
        <div class="val text-primary" id="total-text">—</div>
        <div class="lbl">Total Soal</div>
      </div>
    </div>
  </div>

  <div class="section-divider"></div>

  <!-- Review toggle -->
  <button class="btn-review-toggle mb-2" onclick="toggleReview()" id="btn-review">
    <i class="bi bi-list-check me-2"></i>Lihat Pembahasan Jawaban
  </button>
  <div class="review-wrap" id="review-wrap">
    <div id="review-area" class="pt-2"></div>
  </div>

  <div class="section-divider"></div>

  <button class="btn-home" onclick="clearSession()">
    <i class="bi bi-house-fill me-2"></i>Kembali ke Beranda
  </button>
</div>

<div style="height:3rem"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── Ambil data hasil — robust terhadap berbagai format response ────────────
const raw  = sessionStorage.getItem("hasil_ujian");
const nama = sessionStorage.getItem("siswa_nama") || "—";
const kel  = sessionStorage.getItem("siswa_kelas") || "—";
const mapN = sessionStorage.getItem("exam_mapel_nama") || "—";

// Jangan redirect — tampilkan error graceful kalau data tidak ada
let hasil = {};
if (raw) {
  try { hasil = JSON.parse(raw); } catch { hasil = {}; }
}

// Normalisasi: handle jika API hanya return {nilai, benar, total} tanpa detail
const nilai  = hasil.nilai  ?? hasil.score ?? null;
const benar  = hasil.benar  ?? hasil.correct ?? null;
const total  = hasil.total  ?? hasil.questions ?? null;
const detail = hasil.detail ?? [];

// Jika benar-benar tidak ada data sama sekali, tampilkan pesan bukan redirect
if (nilai === null && benar === null) {
  document.getElementById("nilai-text").textContent = "—";
  document.getElementById("sub-info").textContent   = "Data hasil tidak ditemukan";
  document.getElementById("predikat-text").textContent = "Hubungi guru kamu";
  document.getElementById("benar-text").textContent = "—";
  document.getElementById("salah-text").textContent = "—";
  document.getElementById("total-text").textContent = "—";
} else {
  // ── Tampilkan data ──────────────────────────────────────────────────────
  document.getElementById("sub-info").textContent   = `${nama} · Kelas ${kel} · ${mapN}`;
  document.getElementById("nilai-text").textContent = nilai ?? "—";
  document.getElementById("benar-text").textContent = benar ?? "—";
  document.getElementById("salah-text").textContent = (total != null && benar != null) ? (total - benar) : "—";
  document.getElementById("total-text").textContent = total ?? "—";

  // ── Animasi lingkaran skor ──────────────────────────────────────────────
  const n   = nilai ?? 0;
  const arc = document.getElementById("score-arc");
  const circumference = 389.56;
  setTimeout(() => {
    arc.style.strokeDashoffset = circumference - (circumference * n / 100);
  }, 300);

  // ── Predikat ────────────────────────────────────────────────────────────
  let predikat, emoji, confettiColors;
  if (n >= 90)      { predikat = "Luar Biasa!";    emoji = "🏆"; confettiColors = ["#fbbf24","#f59e0b","#fcd34d","#fff"]; }
  else if (n >= 80) { predikat = "Sangat Baik";    emoji = "⭐"; confettiColors = ["#60a5fa","#3b82f6","#93c5fd","#fff"]; }
  else if (n >= 70) { predikat = "Baik";           emoji = "👍"; confettiColors = ["#34d399","#10b981","#6ee7b7","#fff"]; }
  else if (n >= 60) { predikat = "Cukup";          emoji = "📚"; confettiColors = ["#fbbf24","#d97706","#fde68a","#fff"]; }
  else              { predikat = "Perlu Belajar Lagi"; emoji = "💪"; confettiColors = ["#f87171","#ef4444","#fca5a5","#fff"]; }

  document.getElementById("predikat-text").textContent = `${emoji} ${predikat}`;

  // Confetti dots
  const bar = document.getElementById("confetti-bar");
  confettiColors.concat(confettiColors).forEach((c, i) => {
    const s = document.createElement("span");
    s.style.background = c;
    s.style.animationDelay = `${i * 60}ms`;
    bar.appendChild(s);
  });

  // ── Review jawaban ──────────────────────────────────────────────────────
  let reviewBuilt = false;
  let reviewOpen  = false;

  function buildReview() {
    const area = document.getElementById("review-area");
    if (!detail.length) {
      area.innerHTML = `<p class="text-muted small text-center py-2">Detail pembahasan tidak tersedia.</p>`;
      return;
    }
    detail.forEach((d, i) => {
      const div = document.createElement("div");
      div.className = `review-item ${d.benar ? "correct" : "wrong"}`;
      div.innerHTML = `
        <div class="review-num">${i + 1}</div>
        <div>
          <div class="fw-semibold">${d.benar ? "✓ Jawaban Benar" : "✗ Jawaban Salah"}</div>
          ${!d.benar ? `<div class="review-detail">Jawabanmu: <strong>${d.pilihan || "—"}</strong> &nbsp;·&nbsp; Kunci: <strong>${d.jawaban}</strong></div>` : ""}
        </div>`;
      area.appendChild(div);
    });
  }

  window.toggleReview = function() {
    reviewOpen = !reviewOpen;
    if (reviewOpen && !reviewBuilt) { buildReview(); reviewBuilt = true; }
    document.getElementById("review-wrap").classList.toggle("open", reviewOpen);
    document.getElementById("btn-review").innerHTML = reviewOpen
      ? '<i class="bi bi-eye-slash me-2"></i>Sembunyikan Pembahasan'
      : '<i class="bi bi-list-check me-2"></i>Lihat Pembahasan Jawaban';
  };
}

function clearSession() {
  ["exam_mapel_id","exam_mapel_nama","exam_kelas","siswa_nama","siswa_kelas",
   "siswa_kelas_main","exam_guru_nama","hasil_ujian"].forEach(k => sessionStorage.removeItem(k));
  location.href = "index.html";
}
</script>
</body>
</html>
