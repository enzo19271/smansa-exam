<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hasil Ujian — E-EXAM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    :root { --primary: #1a56db; --accent: #f59e0b; --bg: #f0f4ff; }
    body { background: var(--bg); font-family: 'Segoe UI', sans-serif; }
    .navbar { background: var(--primary); }
    .navbar-brand { font-weight: 700; color: #fff !important; }
    .navbar-brand span { color: var(--accent); }
    .score-ring {
      width: 140px; height: 140px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 8px solid;
      margin: 0 auto 1rem;
    }
    .score-ring .nilai { font-size: 2.4rem; font-weight: 800; line-height: 1; }
    .score-ring .label { font-size: .75rem; opacity: .7; }
    .result-card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(26,86,219,.10); }
    .review-item { padding: .75rem; border-radius: 10px; margin-bottom: .5rem; }
    .review-item.correct { background: #dcfce7; }
    .review-item.wrong { background: #fee2e2; }
  </style>
</head>
<body>

<nav class="navbar px-3 py-2">
  <span class="navbar-brand"><i class="bi bi-mortarboard-fill me-2"></i>E<span>-EXAM</span></span>
</nav>

<div class="container py-4" style="max-width:560px">
  <div class="text-center mb-4">
    <h4 class="fw-bold">Ujian Selesai! 🎉</h4>
    <p class="text-muted small" id="sub-info">—</p>
  </div>

  <!-- Score -->
  <div class="result-card bg-white p-4 mb-3 text-center">
    <div class="score-ring" id="score-ring">
      <span class="nilai" id="nilai-text">—</span>
      <span class="label">NILAI</span>
    </div>
    <div class="row text-center mt-3">
      <div class="col-4">
        <div class="fw-bold fs-5 text-success" id="benar-text">—</div>
        <div class="text-muted small">Benar</div>
      </div>
      <div class="col-4">
        <div class="fw-bold fs-5 text-danger" id="salah-text">—</div>
        <div class="text-muted small">Salah</div>
      </div>
      <div class="col-4">
        <div class="fw-bold fs-5 text-muted" id="total-text">—</div>
        <div class="text-muted small">Total Soal</div>
      </div>
    </div>
  </div>

  <!-- Predikat -->
  <div class="alert mb-3 text-center" id="predikat-alert">—</div>

  <!-- Review toggle -->
  <button class="btn btn-outline-primary w-100 mb-3" onclick="toggleReview()" id="btn-review">
    <i class="bi bi-eye me-2"></i>Lihat Pembahasan Jawaban
  </button>
  <div id="review-area" class="d-none mb-3"></div>

  <a href="index.html" class="btn btn-primary w-100 py-2" onclick="clearSession()">
    <i class="bi bi-house me-2"></i>Kembali ke Beranda
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const hasil    = JSON.parse(sessionStorage.getItem("hasil_ujian") || "{}");
const nama     = sessionStorage.getItem("siswa_nama") || "—";
const kelas    = sessionStorage.getItem("siswa_kelas") || "—";
const mapelNm  = sessionStorage.getItem("exam_mapel_nama") || "—";

if (!hasil.nilai && hasil.nilai !== 0) location.href = "index.html";

document.getElementById("sub-info").textContent = `${nama} — Kelas ${kelas} — ${mapelNm}`;
document.getElementById("nilai-text").textContent = hasil.nilai ?? "—";
document.getElementById("benar-text").textContent = hasil.benar ?? "—";
document.getElementById("salah-text").textContent = (hasil.total - hasil.benar) ?? "—";
document.getElementById("total-text").textContent = hasil.total ?? "—";

// Color ring by score
const ring = document.getElementById("score-ring");
const n = hasil.nilai ?? 0;
if (n >= 80) { ring.style.borderColor = "#16a34a"; ring.style.color = "#16a34a"; }
else if (n >= 60) { ring.style.borderColor = "#f59e0b"; ring.style.color = "#d97706"; }
else { ring.style.borderColor = "#dc2626"; ring.style.color = "#dc2626"; }

// Predikat
const pa = document.getElementById("predikat-alert");
if (n >= 90) { pa.className = "alert alert-success mb-3 text-center"; pa.innerHTML = "⭐ <strong>Sangat Baik</strong> — Hasil yang luar biasa!"; }
else if (n >= 80) { pa.className = "alert alert-success mb-3 text-center"; pa.innerHTML = "👍 <strong>Baik</strong> — Pertahankan prestasimu!"; }
else if (n >= 70) { pa.className = "alert alert-warning mb-3 text-center"; pa.innerHTML = "📚 <strong>Cukup</strong> — Terus belajar ya!"; }
else if (n >= 60) { pa.className = "alert alert-warning mb-3 text-center"; pa.innerHTML = "⚠️ <strong>Kurang</strong> — Perlu lebih banyak latihan."; }
else { pa.className = "alert alert-danger mb-3 text-center"; pa.innerHTML = "❌ <strong>Tidak Lulus</strong> — Jangan menyerah, coba lagi!"; }

// Review
let reviewShown = false;
function toggleReview() {
  reviewShown = !reviewShown;
  const area = document.getElementById("review-area");
  area.classList.toggle("d-none", !reviewShown);
  document.getElementById("btn-review").innerHTML = reviewShown
    ? '<i class="bi bi-eye-slash me-2"></i>Sembunyikan Pembahasan'
    : '<i class="bi bi-eye me-2"></i>Lihat Pembahasan Jawaban';

  if (reviewShown && !area.children.length) {
    (hasil.detail || []).forEach((d, i) => {
      const div = document.createElement("div");
      div.className = `review-item ${d.benar ? "correct" : "wrong"}`;
      div.innerHTML = `
        <div class="d-flex gap-2 align-items-center">
          <span class="badge ${d.benar ? "bg-success" : "bg-danger"}">${i+1}</span>
          <span class="small fw-semibold">${d.benar ? "✓ Benar" : "✗ Salah"}</span>
        </div>
        ${!d.benar ? `<div class="small text-muted mt-1">Jawabanmu: <strong>${d.pilihan || "—"}</strong> &nbsp;|&nbsp; Jawaban benar: <strong>${d.jawaban}</strong></div>` : ""}`;
      area.appendChild(div);
    });
  }
}

function clearSession() {
  ["exam_mapel_id","exam_mapel_nama","exam_kelas","siswa_nama","siswa_kelas",
   "siswa_kelas_main","exam_guru_nama","hasil_ujian"].forEach(k => sessionStorage.removeItem(k));
}
</script>
</body>
</html>
