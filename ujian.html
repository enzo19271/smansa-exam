<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Lembar Ujian — Smansanam Exam Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  
  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --blue-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --blue-accent: #3b82f6;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --answered-color: #10b981;
    }
    
    body { 
      background-color: var(--bg-body); 
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
    }

    .exam-topbar {
      background: #ffffff; 
      color: var(--text-dark); 
      padding: 0.85rem 1.25rem;
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.07);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }
    .exam-topbar .brand-title {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: -0.3px;
    }
    .exam-topbar .brand-title span {
      font-style: italic;
      font-weight: 800;
      background: var(--blue-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .soal-progress { 
      font-size: .78rem; 
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 0.15rem;
    }

    /* TIMER — now with pulse animation when active */
    .exam-topbar .timer {
      background: #f1f5f9; 
      border-radius: 10px;
      padding: 0.4rem 0.85rem; 
      font-weight: 800; 
      font-family: 'Plus Jakarta Sans', monospace; 
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      letter-spacing: 0.5px;
      transition: all 0.3s;
      position: relative;
    }
    .exam-topbar .timer::before {
      content: '';
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
      vertical-align: middle;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    .exam-topbar .timer.warning { 
      background: #fee2e2; 
      color: #dc2626;
      border-color: #fca5a5;
      animation: blink 1s infinite; 
    }
    .exam-topbar .timer.warning::before { background: #dc2626; animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.6} }

    /* PROGRESS BAR */
    .exam-progress-bar {
      height: 3px;
      background: #e2e8f0;
      position: sticky;
      top: 60px;
      z-index: 99;
    }
    .exam-progress-fill {
      height: 100%;
      background: var(--blue-gradient);
      transition: width 0.4s ease;
    }

    .q-card { 
      background: var(--card-bg);
      border: 1.5px solid var(--border-color); 
      border-radius: 18px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      transition: box-shadow 0.2s;
    }
    .q-number {
      width: 36px; height: 36px; border-radius: 10px; 
      background: #f1f5f9;
      color: var(--text-dark); 
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; flex-shrink: 0;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
    }
    .q-text-style {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.65;
      color: var(--text-dark);
      padding-top: 0.2rem;
    }

    .option-label {
      display: flex; align-items: flex-start; gap: .85rem;
      border: 1.5px solid var(--border-color); 
      border-radius: 14px; 
      padding: 0.85rem 1.1rem;
      cursor: pointer; 
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1); 
      margin-bottom: 0.65rem;
      background: #ffffff;
      user-select: none;
    }
    .option-label:hover { 
      border-color: var(--blue-accent); 
      background: rgba(37, 99, 235, 0.03); 
      transform: translateX(2px);
    }
    .option-label.selected { 
      border-color: var(--blue-accent); 
      background: rgba(37, 99, 235, 0.05); 
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    input[type=radio] { display: none; }
    
    .option-letter {
      width: 26px; height: 26px; border-radius: 50%;
      background: #f1f5f9; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .8rem; flex-shrink: 0; 
      transition: all 0.15s ease;
      border: 1px solid var(--border-color);
    }
    .option-label.selected .option-letter { 
      background: var(--blue-gradient); 
      color: #fff; 
      border-color: transparent;
    }

    .btn-nav-action {
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 12px;
      padding: 0.65rem 1rem;
      transition: all 0.2s;
    }
    .btn-outline-custom {
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      color: var(--text-dark);
    }
    .btn-outline-custom:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .btn-primary-custom {
      background: var(--blue-gradient);
      border: none;
      color: #ffffff;
    }
    .btn-primary-custom:hover:not(:disabled) {
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transform: translateY(-1px);
    }

    .nomor-grid { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 0.45rem; 
    }
    .nomor-btn {
      width: 38px; height: 38px; 
      border-radius: 10px; 
      border: 1.5px solid var(--border-color);
      background: #ffffff; 
      font-weight: 700; 
      font-size: .82rem; 
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; 
      transition: all 0.2s ease;
      color: var(--text-dark);
    }
    .nomor-btn:hover {
      border-color: var(--blue-accent);
      background: #f8fafc;
    }
    .nomor-btn.current { 
      border-color: var(--blue-accent); 
      color: var(--blue-accent); 
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      font-weight: 800;
    }
    .nomor-btn.answered { 
      background: var(--answered-color); 
      border-color: var(--answered-color); 
      color: #ffffff !important; 
    }
    .nomor-btn.answered.current {
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    /* answered count indicator */
    .answered-count {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0.25rem 0.6rem;
      background: #f1f5f9;
      border-radius: 20px;
    }
    .answered-count span { color: var(--answered-color); }

    #btn-selesai { 
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); 
      border: none; 
      font-weight: 800; 
      font-size: 0.95rem;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
      transition: all 0.2s;
    }
    #btn-selesai:hover { 
      box-shadow: 0 6px 18px rgba(220, 38, 38, 0.35);
      transform: translateY(-1px);
    }

    /* Slide transition */
    .q-card { animation: slideIn 0.2s ease; }
    @keyframes slideIn {
      from { opacity: 0.6; transform: translateY(6px); }
      to   { opacity: 1;   transform: translateY(0); }
    }

    @media (max-width: 576px) {
      .q-card { padding: 1.25rem !important; border-radius: 16px; }
      .exam-topbar { padding: 0.75rem 1rem; }
      .exam-topbar .timer { font-size: 0.82rem; padding: 0.3rem 0.6rem; }
      .q-text-style { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<div class="exam-topbar">
  <div>
    <div class="brand-title" id="tb-mapel"><span>Smansanam</span> Exam Portal</div>
    <div class="soal-progress" id="tb-progress">Memproses data lembar soal...</div>
  </div>
  <div class="timer" id="timer">00:00</div>
</div>

<!-- thin progress bar -->
<div class="exam-progress-bar">
  <div class="exam-progress-fill" id="progress-fill" style="width:0%"></div>
</div>

<div class="container py-4" style="max-width:640px">

  <div class="q-card p-4 mb-3" id="q-card">
    <div class="d-flex gap-3 align-items-start mb-3">
      <div class="q-number" id="q-num">1</div>
      <p class="mb-0 q-text-style" id="q-text">Memuat daftar pertanyaan ujian, harap tunggu...</p>
    </div>
    <div id="q-options" class="mt-2"></div>
  </div>

  <div class="d-flex gap-2 my-3">
    <button class="btn btn-nav-action btn-outline-custom flex-fill" id="btn-prev" onclick="navigate(-1)">
      <i class="bi bi-chevron-left me-1"></i>Sebelumnya
    </button>
    <button class="btn btn-nav-action btn-primary-custom flex-fill" id="btn-next" onclick="navigate(1)">
      Berikutnya <i class="bi bi-chevron-right ms-1"></i>
    </button>
  </div>

  <div class="bg-white rounded-4 p-3 mb-4 border">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <p class="text-muted mb-0 fw-bold text-uppercase" style="letter-spacing: 0.5px; font-size: 0.72rem;">
        <i class="bi bi-grid-3x3-gap-fill text-primary me-1"></i> Navigasi Soal
      </p>
      <span class="answered-count"><span id="count-answered">0</span> / <span id="count-total">0</span> dijawab</span>
    </div>
    <div class="nomor-grid" id="nomor-grid"></div>
  </div>

  <button class="btn btn-danger w-100 py-2" id="btn-selesai" onclick="konfirmasiSelesai()">
    <i class="bi bi-cloud-arrow-up-fill me-2 fs-5"></i> Selesai & Kumpulkan Jawaban
  </button>
</div>

<!-- Modal konfirmasi -->
<div class="modal fade" id="modalSelesai" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered px-3" style="max-width: 420px;">
    <div class="modal-content border-0 rounded-4 shadow-lg">
      <div class="modal-header border-0 pb-0 pt-4 px-4">
        <h5 class="modal-title fw-bold text-dark"><i class="bi bi-question-circle-fill text-danger me-2"></i>Kumpulkan Jawaban?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body px-4 py-3">
        <p id="modal-summary" class="text-muted small mb-3"></p>
        <div class="alert alert-warning small border-0 rounded-3 mb-0" style="background:#fffbeb; color:#b45309;">
          <i class="bi bi-exclamation-triangle-fill me-1"></i> Setelah dikumpulkan, jawaban tidak dapat diubah kembali.
        </div>
      </div>
      <div class="modal-footer border-0 pt-0 pb-4 px-4 gap-2">
        <button class="btn btn-light rounded-3 fw-bold flex-fill small" data-bs-dismiss="modal" style="border:1px solid var(--border-color);">Periksa Kembali</button>
        <button class="btn btn-danger rounded-3 fw-bold flex-fill small" id="btn-confirm-submit" onclick="submitUjian()">Kumpulkan</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal loading -->
<div class="modal fade" id="modalLoading" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 rounded-4 text-center p-4 shadow">
      <div class="spinner-border text-primary mx-auto mb-3" style="width: 2.5rem; height: 2.5rem;"></div>
      <p class="mb-0 fw-bold text-dark">Mengamankan Lembar Jawaban...</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const mapelId   = sessionStorage.getItem("exam_mapel_id");
const mapelNama = sessionStorage.getItem("exam_mapel_nama");
const kelasMain = sessionStorage.getItem("siswa_kelas_main");
const nama      = sessionStorage.getItem("siswa_nama");
const kelas     = sessionStorage.getItem("siswa_kelas");

if (!mapelId || !nama) location.href = "index.html";

// ── localStorage keys untuk persist antar refresh ──────────────────────────
const LS_JAWABAN = `jawaban_${mapelId}_${kelas}`;
const LS_TIMER   = `timer_${mapelId}_${kelas}`;
const LS_SOAL    = `soal_${mapelId}_${kelasMain}`;

document.getElementById("tb-mapel").innerHTML = `<span>Smansanam</span> — ${mapelNama || mapelId}`;

let soalList  = [];
let jawaban   = {};
let current   = 0;
let timerSecs = 0;
let timerInterval;

// ── Load soal ──────────────────────────────────────────────────────────────
async function loadSoal() {
  // Cek cache soal di localStorage supaya refresh tidak re-fetch
  const cachedSoal = localStorage.getItem(LS_SOAL);
  if (cachedSoal) {
    soalList = JSON.parse(cachedSoal);
  } else {
    try {
      const res = await fetch(`/api/soal?mapel_id=${mapelId}&kelas=${kelasMain}`);
      soalList  = await res.json();
      if (soalList.length) localStorage.setItem(LS_SOAL, JSON.stringify(soalList));
    } catch {
      soalList = [];
    }
  }

  if (!soalList.length) {
    document.getElementById("q-text").textContent = `Soal belum tersedia untuk ${mapelNama || mapelId} kelas ${kelasMain}. Hubungi guru kamu.`;
    document.getElementById("tb-progress").textContent = "Tidak ada soal";
    document.getElementById("btn-selesai").disabled = true;
    return;
  }

  // Restore jawaban dari localStorage
  const savedJawaban = localStorage.getItem(LS_JAWABAN);
  if (savedJawaban) jawaban = JSON.parse(savedJawaban);

  // Restore atau inisialisasi timer
  const savedTimer = localStorage.getItem(LS_TIMER);
  if (savedTimer) {
    timerSecs = parseInt(savedTimer);
  } else {
    timerSecs = soalList.length * 120; // 2 menit per soal
    localStorage.setItem(LS_TIMER, timerSecs);
  }

  document.getElementById("count-total").textContent = soalList.length;
  startTimer();
  buildNomorGrid();
  renderSoal(0);
}

// ── Timer — disimpan ke localStorage setiap tick ───────────────────────────
function startTimer() {
  updateTimerDisplay(timerSecs);
  timerInterval = setInterval(() => {
    timerSecs--;
    localStorage.setItem(LS_TIMER, timerSecs);
    updateTimerDisplay(timerSecs);
    if (timerSecs <= 0) { clearInterval(timerInterval); submitUjian(); }
  }, 1000);
}

function updateTimerDisplay(secs) {
  const m  = String(Math.floor(secs / 60)).padStart(2, "0");
  const s  = String(secs % 60).padStart(2, "0");
  const el = document.getElementById("timer");
  el.textContent = `${m}:${s}`;
  el.classList.toggle("warning", secs <= 60);
}

// ── Render soal ────────────────────────────────────────────────────────────
function renderSoal(idx) {
  current = idx;
  const s = soalList[idx];

  // Animate
  const qcard = document.getElementById("q-card");
  qcard.style.animation = "none";
  qcard.offsetHeight; // reflow
  qcard.style.animation = "";

  document.getElementById("q-num").textContent  = idx + 1;
  document.getElementById("q-text").textContent = s.pertanyaan;
  document.getElementById("tb-progress").textContent = `Soal ${idx + 1} dari ${soalList.length}`;

  // Update progress bar
  document.getElementById("progress-fill").style.width =
    `${Math.round(((idx + 1) / soalList.length) * 100)}%`;

  const opts = document.getElementById("q-options");
  opts.innerHTML = "";
  ["A","B","C","D"].forEach(letter => {
    const selected = jawaban[s.id] === letter;
    const div = document.createElement("div");
    div.className = `option-label${selected ? " selected" : ""}`;
    div.onclick = () => pilihJawaban(s.id, letter, div);
    div.innerHTML = `
      <div class="option-letter">${letter}</div>
      <div style="font-size:.92rem; font-weight:500; padding-top:1px">${s.opsi[letter] || "—"}</div>`;
    opts.appendChild(div);
  });

  document.getElementById("btn-prev").disabled = idx === 0;
  document.getElementById("btn-next").disabled = idx === soalList.length - 1;
  updateNomorGrid();
}

// ── Pilih jawaban — simpan ke localStorage ─────────────────────────────────
function pilihJawaban(soalId, letter, el) {
  jawaban[soalId] = letter;
  localStorage.setItem(LS_JAWABAN, JSON.stringify(jawaban)); // persist!
  document.querySelectorAll(".option-label").forEach(e => e.classList.remove("selected"));
  el.classList.add("selected");
  updateNomorGrid();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < soalList.length) renderSoal(next);
}

// ── Nomor grid ─────────────────────────────────────────────────────────────
function buildNomorGrid() {
  const grid = document.getElementById("nomor-grid");
  grid.innerHTML = "";
  soalList.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "nomor-btn";
    btn.id = `nb-${i}`;
    btn.textContent = i + 1;
    btn.onclick = () => renderSoal(i);
    grid.appendChild(btn);
  });
}

function updateNomorGrid() {
  let answered = 0;
  soalList.forEach((s, i) => {
    const btn = document.getElementById(`nb-${i}`);
    if (!btn) return;
    btn.classList.toggle("current",  i === current);
    btn.classList.toggle("answered", !!jawaban[s.id]);
    if (jawaban[s.id]) answered++;
  });
  document.getElementById("count-answered").textContent = answered;
}

// ── Submit ─────────────────────────────────────────────────────────────────
function konfirmasiSelesai() {
  const total   = soalList.length;
  const dijawab = Object.keys(jawaban).length;
  const belum   = total - dijawab;
  document.getElementById("modal-summary").innerHTML =
    `Anda telah menjawab <strong>${dijawab}</strong> dari <strong>${total}</strong> soal.${belum > 0 ? ` <span class="text-danger fw-bold">${belum} soal belum diisi.</span>` : " Semua soal sudah dijawab."}`;
  new bootstrap.Modal(document.getElementById("modalSelesai")).show();
}

async function submitUjian() {
  clearInterval(timerInterval);
  bootstrap.Modal.getInstance(document.getElementById("modalSelesai"))?.hide();
  new bootstrap.Modal(document.getElementById("modalLoading")).show();

  try {
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // kirim kelas lengkap (10.2) — submit.js akan split sendiri untuk cari file soal
      body: JSON.stringify({ nama, kelas, mapel_id: mapelId, jawaban }),
    });
    const result = await res.json();

    // Bersihkan localStorage ujian ini
    localStorage.removeItem(LS_JAWABAN);
    localStorage.removeItem(LS_TIMER);
    localStorage.removeItem(LS_SOAL);

    sessionStorage.setItem("hasil_ujian", JSON.stringify(result));
    location.href = "selesai.html";
  } catch(err) {
    bootstrap.Modal.getInstance(document.getElementById("modalLoading"))?.hide();
    alert("Gagal mengumpulkan jawaban. Periksa koneksi internet, lalu coba lagi.\n\nJawaban kamu aman tersimpan di perangkat.");
  }
}

loadSoal();
</script>
</body>
</html>
