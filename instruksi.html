<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
  <title>Instruksi Ujian — Smansanam Exam Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  
  <style>
    :root {
      --primary-blue: #2563eb;
      --bg-base: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      /* Subtle Lightweight Shadows */
      --light-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    [data-bs-theme="dark"] {
      --primary-blue: #3b82f6;
      --bg-base: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --light-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    body { 
      background-color: var(--bg-base); 
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* NAVBAR (FLAT & CLEAN) */
    .navbar { 
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 1rem;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* STUDENT BADGE CONTAINER */
    .student-badge {
      background: var(--primary-blue);
      color: #ffffff;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.15);
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* INSTRUCTION SOLID CARD */
    .info-card { 
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.25rem 2rem;
      box-shadow: var(--light-shadow);
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.05s;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .instr-item {
      display: flex;
      gap: 16px;
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px dashed var(--card-border);
    }
    .instr-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .instr-icon {
      width: 42px; height: 42px; 
      border-radius: 12px; 
      background: rgba(37, 99, 235, 0.08);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary-blue); 
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    /* CHECKBOX CUSTOM STYLING */
    .form-check-input {
      width: 1.3rem; height: 1.3rem;
      border-radius: 6px; 
      border: 2px solid var(--card-border);
      background-color: var(--bg-base);
      cursor: pointer;
    }
    .form-check-input:checked {
      background-color: var(--primary-blue);
      border-color: var(--primary-blue);
    }
    .form-check-label {
      cursor: pointer;
      user-select: none;
      padding-top: 2px;
    }

    /* SNAPPY ACTION BUTTONS */
    #btn-mulai { 
      background: #10b981; 
      border: none; 
      color: #ffffff;
      font-weight: 700; 
      padding: 0.9rem;
      border-radius: 14px; 
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
    }
    #btn-mulai:hover:not(:disabled) { 
      background: #059669;
      transform: translateY(-2px); 
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
    }
    #btn-mulai:active {
      transform: translateY(0);
    }
    #btn-mulai:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-outline-back {
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 700;
      padding: 0.9rem;
      border-radius: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-outline-back:hover {
      background: var(--bg-base);
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    /* ALERT RECOVERY OVERRIDES */
    .alert { 
      border-radius: 14px !important; 
    }
    .alert-warning {
      background: rgba(245, 158, 11, 0.08) !important;
      border: 1px solid rgba(245, 158, 11, 0.2) !important;
      color: var(--text-main) !important;
    }

    /* FAST TRANSITION ANIMATION */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 576px) {
      .info-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>

<nav class="navbar sticky-top">
  <div class="container-fluid d-flex justify-content-center">
    <div class="fw-extrabold fs-5 text-primary" style="letter-spacing: -0.5px;">Smansanam <span class="text-dark" style="color: var(--text-main) !important;">Exam Portal</span></div>
  </div>
</nav>

<div class="container py-5" style="max-width:520px">

  <div class="student-badge mb-4">
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-person-circle fs-1"></i>
      <div>
        <h6 class="mb-0 fw-bold fs-5" id="s-nama">—</h6>
        <div class="small opacity-75 fw-semibold mt-1">
          <span id="s-kelas">—</span> &bull; <span id="s-mapel">—</span>
        </div>
      </div>
    </div>
  </div>

  <div class="info-card mb-4">
    <h5 class="fw-bold mb-4 d-flex align-items-center gap-2" style="letter-spacing: -0.3px;">
      <i class="bi bi-book-half text-primary"></i> Instruksi Pengerjaan
    </h5>
    
    <div class="instr-item">
      <div class="instr-icon"><i class="bi bi-clock-fill"></i></div>
      <div>
        <div class="fw-bold small text-uppercase text-muted" style="letter-spacing: 0.3px;">Durasi Waktu</div>
        <div class="small fw-semibold mt-1">Ujian memiliki hitung mundur otomatis.</div>
      </div>
    </div>

    <div class="instr-item">
      <div class="instr-icon"><i class="bi bi-ui-checks"></i></div>
      <div>
        <div class="fw-bold small text-uppercase text-muted" style="letter-spacing: 0.3px;">Format Soal</div>
        <div class="small fw-semibold mt-1">Pilihan ganda dengan 4 opsi jawaban.</div>
      </div>
    </div>

    <div class="instr-item">
      <div class="instr-icon"><i class="bi bi-shield-lock-fill"></i></div>
      <div>
        <div class="fw-bold small text-uppercase text-muted" style="letter-spacing: 0.3px;">Integritas Akademik</div>
        <div class="small fw-semibold mt-1">Sistem mencatat aktivitas perpindahan halaman.</div>
      </div>
    </div>
  </div>

  <div class="form-check d-flex align-items-start gap-2 mb-4 ms-1">
    <input class="form-check-input mt-0" type="checkbox" id="cb-setuju"/>
    <label class="form-check-label small fw-bold" for="cb-setuju">
      Saya siap melaksanakan ujian secara jujur dan mandiri.
    </label>
  </div>

  <button class="btn btn-success w-100 mb-3" id="btn-mulai" onclick="mulaiUjian()" disabled>
    <i class="bi bi-play-fill me-1"></i> Mulai Ujian Sekarang
  </button>
  
  <a href="index.html" class="btn-outline-back w-100">
    <i class="bi bi-house-door-fill me-2"></i> Kembali ke Beranda
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Logic JS tidak diubah sama sekali (100% bawaan asli)
const nama     = sessionStorage.getItem("siswa_nama");
const kelas    = sessionStorage.getItem("siswa_kelas");
const mapelId  = sessionStorage.getItem("exam_mapel_id");
const mapelNm  = sessionStorage.getItem("exam_mapel_nama");

if (!nama || !kelas || !mapelId) location.href = "index.html";

document.getElementById("s-nama").textContent  = nama;
document.getElementById("s-kelas").textContent = `Kelas ${kelas}`;
document.getElementById("s-mapel").textContent = mapelNm || mapelId;

const kelasMain = sessionStorage.getItem("siswa_kelas_main");
const LS_JAWABAN = `jawaban_${mapelId}_${kelas}`;
const LS_TIMER   = `timer_${mapelId}_${kelas}`;
const savedJawaban = localStorage.getItem(LS_JAWABAN);
const savedTimer   = localStorage.getItem(LS_TIMER);

if (savedJawaban || savedTimer) {
  const cb = document.getElementById("cb-setuju").parentElement;
  const banner = document.createElement("div");
  banner.className = "alert alert-warning d-flex align-items-center gap-3 mb-4 shadow-sm";
  banner.innerHTML = `
    <i class="bi bi-arrow-clockwise fs-4"></i>
    <div class="flex-grow-1">
      <strong>Sesi sebelumnya ditemukan.</strong>
      <div class="small fw-semibold">Lanjutkan pengerjaan Anda.</div>
    </div>
    <button class="btn btn-sm btn-outline-warning fw-bold" onclick="clearSesi()">Hapus</button>`;
  cb.parentElement.insertBefore(banner, cb);
  document.getElementById("btn-mulai").innerHTML = '<i class="bi bi-arrow-clockwise me-2"></i>Lanjutkan Ujian';
}

function clearSesi() {
  localStorage.removeItem(LS_JAWABAN);
  localStorage.removeItem(LS_TIMER);
  localStorage.removeItem(`soal_${mapelId}_${kelas}`);
  location.reload();
}

document.getElementById("cb-setuju").addEventListener("change", function () {
  document.getElementById("btn-mulai").disabled = !this.checked;
});

function mulaiUjian() {
  location.href = "ujian.html";
}

// Integrasi sinkronisasi status dark mode dari LocalStorage halaman sebelumnya
const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-bs-theme', savedTheme);
</script>
</body>
</html>
