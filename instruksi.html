<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
  <title>Instruksi Ujian — Smansanam Exam Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  
  <style>
    :root {
      --primary-blue: #2563eb;
      --bg-base: #f1f5f9;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    body { 
      background-color: var(--bg-base); 
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.1) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .navbar { 
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem;
    }

    .student-badge {
      background: var(--primary-blue);
      color: #fff;
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .info-card { 
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 2rem;
      box-shadow: var(--glass-shadow);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .instr-icon {
      width: 45px; height: 45px; 
      border-radius: 16px; 
      background: rgba(37, 99, 235, 0.1);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary-blue); 
      font-size: 1.2rem;
    }

    .form-check-input {
      width: 1.4rem; height: 1.4rem;
      border-radius: 8px; border: 2px solid var(--text-muted);
    }

    #btn-mulai { 
      background: #10b981; border: none; 
      font-weight: 800; padding: 1rem;
      border-radius: 16px; transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    #btn-mulai:hover:not(:disabled) { transform: translateY(-2px); }

    .btn-outline-back {
      border: 1px solid var(--text-muted);
      background: transparent;
      color: var(--text-main);
      font-weight: 700;
      border-radius: 16px;
    }

    .alert { backdrop-filter: blur(5px); border-radius: 16px !important; }
  </style>
</head>
<body>

<nav class="navbar sticky-top">
  <div class="container-fluid d-flex justify-content-center">
    <div class="fw-bolder fs-5 text-primary">Smansanam <span class="text-dark">Exam Portal</span></div>
  </div>
</nav>

<div class="container py-5" style="max-width:540px">

  <div class="student-badge mb-4">
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-person-circle fs-1"></i>
      <div>
        <h6 class="mb-0 fw-bold" id="s-nama">—</h6>
        <div class="small opacity-75">
          <span id="s-kelas">—</span> • <span id="s-mapel">—</span>
        </div>
      </div>
    </div>
  </div>

  <div class="info-card mb-4">
    <h5 class="fw-bolder mb-4 d-flex align-items-center"><i class="bi bi-book-half me-2"></i>Instruksi Pengerjaan</h5>
    
    <div class="instr-item mb-3">
      <div class="d-flex gap-3">
        <div class="instr-icon"><i class="bi bi-clock-fill"></i></div>
        <div>
          <div class="fw-bold">Durasi Waktu</div>
          <div class="small text-muted">Ujian memiliki hitung mundur otomatis.</div>
        </div>
      </div>
    </div>

    <div class="instr-item mb-3">
      <div class="d-flex gap-3">
        <div class="instr-icon"><i class="bi bi-ui-checks"></i></div>
        <div>
          <div class="fw-bold">Format Soal</div>
          <div class="small text-muted">Pilihan ganda dengan 4 opsi jawaban.</div>
        </div>
      </div>
    </div>

    <div class="instr-item mb-3">
      <div class="d-flex gap-3">
        <div class="instr-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <div>
          <div class="fw-bold">Integritas Akademik</div>
          <div class="small text-muted">Sistem mencatat aktivitas perpindahan halaman.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="form-check mb-4 ms-2">
    <input class="form-check-input" type="checkbox" id="cb-setuju"/>
    <label class="form-check-label fw-bold" for="cb-setuju">
      Saya siap melaksanakan ujian secara jujur dan mandiri.
    </label>
  </div>

  <button class="btn btn-success w-100 mb-3" id="btn-mulai" onclick="mulaiUjian()" disabled>
    <i class="bi bi-play-fill me-1"></i> Mulai Ujian Sekarang
  </button>
  <a href="index.html" class="btn btn-outline-back w-100">
    <i class="bi bi-house-door-fill me-2"></i> Kembali ke Beranda
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Logic JS tidak berubah sama sekali
const nama     = sessionStorage.getItem("siswa_nama");
const kelas    = sessionStorage.getItem("siswa_kelas");
const mapelId  = sessionStorage.getItem("exam_mapel_id");
const mapelNm  = sessionStorage.getItem("exam_mapel_nama");

if (!nama || !kelas || !mapelId) location.href = "index.html";

document.getElementById("s-nama").textContent  = nama;
document.getElementById("s-kelas").textContent = `Kelas ${kelas}`;
document.getElementById("s-mapel").textContent = mapelNm || mapelId;

const kelasMain = sessionStorage.getItem("siswa_kelas_main");
const LS_JAWABAN = `jawaban_${mapelId}_${kelas}`;
const LS_TIMER   = `timer_${mapelId}_${kelas}`;
const savedJawaban = localStorage.getItem(LS_JAWABAN);
const savedTimer   = localStorage.getItem(LS_TIMER);

if (savedJawaban || savedTimer) {
  const cb = document.getElementById("cb-setuju").parentElement;
  const banner = document.createElement("div");
  banner.className = "alert alert-warning d-flex align-items-center gap-3 mb-4";
  banner.innerHTML = `
    <i class="bi bi-arrow-clockwise fs-4"></i>
    <div class="flex-grow-1">
      <strong>Sesi sebelumnya ditemukan.</strong>
      <div class="small">Lanjutkan pengerjaan Anda.</div>
    </div>
    <button class="btn btn-sm btn-outline-warning fw-bold" onclick="clearSesi()">Hapus</button>`;
  cb.parentElement.insertBefore(banner, cb);
  document.getElementById("btn-mulai").innerHTML = '<i class="bi bi-arrow-clockwise me-2"></i>Lanjutkan Ujian';
}

function clearSesi() {
  localStorage.removeItem(LS_JAWABAN);
  localStorage.removeItem(LS_TIMER);
  localStorage.removeItem(`soal_${mapelId}_${kelas}`);
  location.reload();
}

document.getElementById("cb-setuju").addEventListener("change", function () {
  document.getElementById("btn-mulai").disabled = !this.checked;
});

function mulaiUjian() {
  location.href = "ujian.html";
}
</script>
</body>
</html>
