<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Daftar Ujian — E-EXAM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    :root { --primary: #1a56db; --accent: #f59e0b; --bg: #f0f4ff; }
    body { background: var(--bg); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
    .navbar { background: var(--primary); }
    .navbar-brand { font-weight: 700; color: #fff !important; }
    .navbar-brand span { color: var(--accent); }
    .form-card {
      border: none; border-radius: 18px;
      box-shadow: 0 4px 24px rgba(26,86,219,.12); background: #fff;
    }
    .step-badge {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .85rem; flex-shrink: 0;
    }
    .mapel-pill {
      background: #e8f0fe; color: var(--primary);
      border-radius: 50px; padding: .3rem .9rem;
      font-weight: 600; display: inline-block; font-size: .9rem;
    }
    .kelas-pill {
      background: #fef3c7; color: #92400e;
      border-radius: 50px; padding: .3rem .9rem;
      font-weight: 600; display: inline-block; font-size: .9rem;
    }
    .key-input { letter-spacing: .15em; font-family: monospace; font-size: 1.1rem; }
    #btn-submit { background: var(--primary); border: none; font-weight: 700; }
    #btn-submit:hover { background: #1245b0; }
  </style>
</head>
<body>

<nav class="navbar px-3 py-2">
  <a href="index.html" class="navbar-brand"><i class="bi bi-arrow-left me-2"></i>E<span>-EXAM</span></a>
</nav>

<div class="container py-4" style="max-width:520px">
  <div class="text-center mb-4">
    <h4 class="fw-bold mb-1">Formulir Pendaftaran Ujian</h4>
    <p class="text-muted small mb-0">Isi data dengan benar sebelum memulai ujian</p>
  </div>

  <!-- Info ujian -->
  <div class="mb-3 text-center">
    <span class="mapel-pill me-2" id="info-mapel">—</span>
    <span class="kelas-pill" id="info-kelas">—</span>
  </div>

  <div class="form-card p-4">
    <!-- Step 1: Nama -->
    <div class="d-flex align-items-start gap-3 mb-4">
      <span class="step-badge">1</span>
      <div class="w-100">
        <label class="form-label fw-semibold mb-1">Nama Lengkap</label>
        <input type="text" id="inp-nama" class="form-control" placeholder="Masukkan nama lengkap kamu" autocomplete="off"/>
        <div class="invalid-feedback">Nama tidak boleh kosong.</div>
      </div>
    </div>

    <!-- Step 2: Sub-kelas -->
    <div class="d-flex align-items-start gap-3 mb-4">
      <span class="step-badge">2</span>
      <div class="w-100">
        <label class="form-label fw-semibold mb-1">Kelas</label>
        <select id="inp-subkelas" class="form-select">
          <option value="">— Pilih kelas —</option>
        </select>
        <div class="invalid-feedback">Pilih kelas terlebih dahulu.</div>
      </div>
    </div>

    <!-- Step 3: Key guru -->
    <div class="d-flex align-items-start gap-3 mb-4">
      <span class="step-badge">3</span>
      <div class="w-100">
        <label class="form-label fw-semibold mb-1">Key Ujian dari Guru</label>
        <input type="text" id="inp-key" class="form-control key-input" placeholder="Masukkan key dari guru" autocomplete="off"/>
        <div class="form-text">Key diberikan oleh guru sebelum ujian dimulai.</div>
        <div class="invalid-feedback">Key tidak boleh kosong.</div>
        <div id="key-error" class="text-danger small mt-1 d-none">
          <i class="bi bi-x-circle me-1"></i>Key tidak valid atau tidak sesuai kelas/mapel ini.
        </div>
      </div>
    </div>

    <button class="btn btn-primary w-100 py-2" id="btn-submit" onclick="submitForm()">
      <span id="btn-text"><i class="bi bi-arrow-right-circle me-2"></i>Lanjut ke Instruksi</span>
      <span id="btn-loading" class="d-none">
        <span class="spinner-border spinner-border-sm me-2"></span>Memeriksa...
      </span>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const mapelId   = sessionStorage.getItem("exam_mapel_id");
const mapelNama = sessionStorage.getItem("exam_mapel_nama");
const kelas     = sessionStorage.getItem("exam_kelas");

if (!mapelId || !kelas) location.href = "index.html";

document.getElementById("info-mapel").textContent = mapelNama || mapelId;
document.getElementById("info-kelas").textContent = `Kelas ${kelas}`;

// Populate sub-kelas options (e.g. 10.1 – 10.6)
const subSelect = document.getElementById("inp-subkelas");
for (let i = 1; i <= 6; i++) {
  const opt = document.createElement("option");
  opt.value = `${kelas}.${i}`;
  opt.textContent = `${kelas}.${i}`;
  subSelect.appendChild(opt);
}

function setLoading(v) {
  document.getElementById("btn-text").classList.toggle("d-none", v);
  document.getElementById("btn-loading").classList.toggle("d-none", !v);
  document.getElementById("btn-submit").disabled = v;
}

async function submitForm() {
  const nama    = document.getElementById("inp-nama").value.trim();
  const subkelas = document.getElementById("inp-subkelas").value;
  const key     = document.getElementById("inp-key").value.trim();
  const keyErr  = document.getElementById("key-error");

  let valid = true;
  document.getElementById("inp-nama").classList.toggle("is-invalid", !nama);
  document.getElementById("inp-subkelas").classList.toggle("is-invalid", !subkelas);
  document.getElementById("inp-key").classList.toggle("is-invalid", !key);
  if (!nama || !subkelas || !key) return;

  keyErr.classList.add("d-none");
  setLoading(true);

  try {
    const res = await fetch("/api/verify-key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mapel_id: mapelId, kelas: Number(kelas), key }),
    });
    const json = await res.json();

    if (!json.valid) {
      keyErr.classList.remove("d-none");
      document.getElementById("inp-key").classList.add("is-invalid");
      setLoading(false);
      return;
    }

    // Save siswa info
    sessionStorage.setItem("siswa_nama", nama);
    sessionStorage.setItem("siswa_kelas", subkelas);
    sessionStorage.setItem("siswa_kelas_main", kelas);
    sessionStorage.setItem("exam_guru_nama", json.guru_nama || "");
    location.href = "instruksi.html";

  } catch {
    keyErr.textContent = "Terjadi kesalahan jaringan, coba lagi.";
    keyErr.classList.remove("d-none");
    setLoading(false);
  }
}
</script>
</body>
</html>
