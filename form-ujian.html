<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
  <title>Daftar Ujian — Smansanam Exam Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  
  <style>
    :root {
      --primary-blue: #2563eb;
      --bg-base: #f1f5f9;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    body { 
      background-color: var(--bg-base); 
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.1) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .navbar { 
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem;
    }

    .btn-back-arrow {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    .btn-back-arrow:hover { background: #fff; transform: translateX(-3px); }

    .mapel-pill {
      background: rgba(37, 99, 235, 0.1); color: var(--primary-blue);
      border: 1px solid rgba(37, 99, 235, 0.2);
      border-radius: 50px; padding: 0.4rem 1.2rem;
      font-weight: 700; display: inline-block; font-size: .85rem;
    }

    .form-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 28px; padding: 2rem;
      box-shadow: var(--glass-shadow);
      animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    .step-badge {
      width: 32px; height: 32px; border-radius: 12px;
      background: var(--primary-blue); color: white;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .9rem; flex-shrink: 0;
    }

    .form-label { font-size: 0.85rem; font-weight: 700; color: var(--text-main); }
    
    .form-control, .form-select {
      padding: 0.8rem 1rem;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 16px; font-weight: 500;
    }
    
    .form-control:focus, .form-select:focus {
      background: #fff;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    #btn-submit { 
      background: var(--primary-blue); border: none; 
      font-weight: 800; padding: 0.9rem;
      border-radius: 16px; transition: all 0.3s ease;
    }
    #btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3); }

    .alert-dup {
      background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 16px; padding: 1rem;
    }
  </style>
</head>
<body>

<nav class="navbar sticky-top">
  <div class="container-fluid d-flex align-items-center">
    <a href="index.html" class="btn-back-arrow" title="Kembali">
      <i class="bi bi-arrow-left"></i>
    </a>
    <div class="fw-bold fs-5 mx-auto">Portal Ujian</div>
    <div style="width:40px;"></div>
  </div>
</nav>

<div class="container py-5" style="max-width:500px">
  <div class="text-center mb-4" style="animation:fadeInUp 0.4s ease both">
    <h3 class="fw-bolder mb-2">Formulir Pendaftaran</h3>
    <p class="text-muted small">Lengkapi data untuk memulai ujian</p>
    <span class="mapel-pill" id="info-mapel">—</span>
  </div>

  <div class="form-card">
    <div class="d-flex align-items-start gap-3 mb-4">
      <span class="step-badge">1</span>
      <div class="w-100">
        <label class="form-label mb-1">Nama Lengkap</label>
        <input type="text" id="inp-nama" class="form-control" placeholder="Nama sesuai absen" autocomplete="off"/>
        <div class="invalid-feedback">Nama wajib diisi.</div>
      </div>
    </div>

    <div class="d-flex align-items-start gap-3 mb-4">
      <span class="step-badge">2</span>
      <div class="w-100">
        <label class="form-label mb-1">Pilih Kelas</label>
        <select id="inp-kelas" class="form-select">
          <option value="">— Pilih kelas —</option>
          <optgroup label="Kelas 10">
            <option value="10.1">10.1</option><option value="10.2">10.2</option><option value="10.3">10.3</option>
            <option value="10.4">10.4</option><option value="10.5">10.5</option><option value="10.6">10.6</option>
          </optgroup>
          <optgroup label="Kelas 11">
            <option value="11.1">11.1</option><option value="11.2">11.2</option><option value="11.3">11.3</option>
            <option value="11.4">11.4</option><option value="11.5">11.5</option><option value="11.6">11.6</option>
          </optgroup>
          <optgroup label="Kelas 12">
            <option value="12.1">12.1</option><option value="12.2">12.2</option><option value="12.3">12.3</option>
            <option value="12.4">12.4</option><option value="12.5">12.5</option><option value="12.6">12.6</option>
          </optgroup>
        </select>
      </div>
    </div>

    <div class="d-flex align-items-start gap-3 mb-4">
      <span class="step-badge">3</span>
      <div class="w-100">
        <label class="form-label mb-1">Key Ujian</label>
        <input type="text" id="inp-key" class="form-control" placeholder="CONTOH: XYZ123" autocomplete="off"/>
        <div id="key-error" class="text-danger small mt-2 d-none fw-bold"><i class="bi bi-x-circle-fill me-1"></i>Key tidak valid.</div>
        <div id="deadline-error" class="mt-2 d-none p-3 rounded-3 bg-warning-subtle text-warning-emphasis">
          <div class="fw-bold mb-1" id="deadline-title"></div>
          <div class="small" id="deadline-desc"></div>
        </div>
        <div id="duplicate-error" class="alert-dup mt-3 d-none">
          <div class="fw-bold text-danger mb-1"><i class="bi bi-slash-circle-fill me-1"></i>Sudah Dikerjakan</div>
          <div class="small text-danger" id="duplicate-msg"></div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary w-100" id="btn-submit" onclick="submitForm()">
      <span id="btn-text"><i class="bi bi-arrow-right-circle-fill me-2"></i>Lanjut ke Instruksi</span>
      <span id="btn-loading" class="d-none">
        <span class="spinner-border spinner-border-sm me-2"></span><span id="loading-msg">Memeriksa...</span>
      </span>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Logic JS tetap sama seperti aslinya
const mapelId   = sessionStorage.getItem("exam_mapel_id");
const mapelNama = sessionStorage.getItem("exam_mapel_nama");

if (!mapelId) location.href = "index.html";

document.getElementById("info-mapel").textContent = mapelNama || mapelId;

function setLoading(on, msg = "Memeriksa...") {
  document.getElementById("btn-text").classList.toggle("d-none", on);
  document.getElementById("btn-loading").classList.toggle("d-none", !on);
  document.getElementById("btn-submit").disabled = on;
  document.getElementById("loading-msg").textContent = msg;
}

function clearErrors() {
  ["inp-nama","inp-kelas","inp-key"].forEach(id => {
    document.getElementById(id).classList.remove("is-invalid");
  });
  document.getElementById("key-error").classList.add("d-none");
  document.getElementById("deadline-error").classList.add("d-none");
  document.getElementById("duplicate-error").classList.add("d-none");
}

async function submitForm() {
  clearErrors();
  const nama  = document.getElementById("inp-nama").value.trim();
  const kelas = document.getElementById("inp-kelas").value;
  const key   = document.getElementById("inp-key").value.trim();

  let valid = true;
  if (!nama)  { document.getElementById("inp-nama").classList.add("is-invalid");  valid = false; }
  if (!kelas) { document.getElementById("inp-kelas").classList.add("is-invalid"); valid = false; }
  if (!key)   { document.getElementById("inp-key").classList.add("is-invalid");   valid = false; }
  if (!valid) return;

  setLoading(true, "Memeriksa Token...");

  try {
    const keyRes  = await fetch("/api/verify-key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mapel_id: mapelId, kelas, key }),
    });
    const keyJson = await keyRes.json();

    if (!keyJson.valid) {
      if (keyJson.code === "BELUM_MULAI") {
        const fmt = keyJson.waktu_mulai ? new Date(keyJson.waktu_mulai).toLocaleString("id-ID") : "—";
        document.getElementById("deadline-title").innerHTML = `<i class="bi bi-clock me-1"></i>Ujian Belum Dimulai`;
        document.getElementById("deadline-desc").textContent = `Ujian mulai: ${fmt}.`;
        document.getElementById("deadline-error").classList.remove("d-none");
      } else if (keyJson.code === "SUDAH_SELESAI") {
        const fmt = keyJson.waktu_selesai ? new Date(keyJson.waktu_selesai).toLocaleString("id-ID") : "—";
        document.getElementById("deadline-title").innerHTML = `<i class="bi bi-calendar-x me-1"></i>Ujian Berakhir`;
        document.getElementById("deadline-desc").textContent = `Ujian ditutup sejak: ${fmt}.`;
        document.getElementById("deadline-error").classList.remove("d-none");
      } else {
        document.getElementById("key-error").classList.remove("d-none");
      }
      document.getElementById("inp-key").classList.add("is-invalid");
      setLoading(false);
      return;
    }

    setLoading(true, "Memeriksa Data Peserta...");
    const cekRes  = await fetch(`/api/submit?nama=${encodeURIComponent(nama)}&kelas=${encodeURIComponent(kelas)}&mapel_id=${encodeURIComponent(mapelId)}`);
    const cekJson = await cekRes.json();

    if (cekJson.sudah) {
      document.getElementById("duplicate-msg").textContent = `Kamu sudah mengerjakan ujian ini dengan nilai ${cekJson.nilai ?? "—"}.`;
      document.getElementById("duplicate-error").classList.remove("d-none");
      setLoading(false);
      return;
    }

    sessionStorage.setItem("siswa_nama", nama);
    sessionStorage.setItem("siswa_kelas", kelas);
    sessionStorage.setItem("siswa_kelas_main", kelas.split(".")[0]);
    sessionStorage.setItem("exam_guru_nama", keyJson.guru_nama || "");
    sessionStorage.setItem("exam_ujian_id", keyJson.ujian_id || "");
    location.href = "instruksi.html";
  } catch {
    document.getElementById("key-error").innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i>Gagal terhubung ke server.';
    document.getElementById("key-error").classList.remove("d-none");
    setLoading(false);
  }
}

document.addEventListener("keydown", e => { if (e.key === "Enter") submitForm(); });
</script>
</body>
</html>
